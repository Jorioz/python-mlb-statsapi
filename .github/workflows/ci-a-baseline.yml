# CIS*4150 experiment, config A: Baseline.
# Every test (offline + live MLB API), one job, serial, no dependency cache.
name: "CI-A Baseline"

on:
  push:
    branches: ["ci-experiment", "replay/**", "defect/**", "timing/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: All tests (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r experiment/ci/requirements-ci.txt
          python -m pip install --no-deps -e .
      - name: Run all tests
        run: python -m pytest tests/ -p no:cacheprovider --junitxml=junit-all.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-baseline
          path: junit-*.xml
